<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사람 몰래 똥싸기 · 겨울 놀이터</title>
<style>
* {box-sizing:border-box}
body {margin:0;background:#192d35;color:#f5f8fa;font:16px/1.5 system-ui,"Apple SD Gothic Neo",sans-serif}
main {max-width:clamp(320px,(100dvh - 300px)*1.52,860px);margin:auto;padding:18px clamp(10px,3vw,30px) 26px}
header,footer,.bar {display:flex;align-items:center;justify-content:space-between;gap:12px}
header {border-bottom:1px solid #647776;padding-bottom:10px;font-size:14px}
a {color:inherit} header a {text-decoration:none}
h1 {font-size:clamp(29px,6vw,52px);letter-spacing:-.065em;margin:12px 0 8px}
h1 small {font-size:.3em;letter-spacing:0;color:#ffc667;margin-left:.5em}
.stage {position:relative;background:#edf1f3;border:3px solid #102628;border-radius:16px;overflow:hidden;box-shadow:0 5px #101f23}
.stage {aspect-ratio:624/410;container-type:inline-size}
canvas {display:block;width:100%;height:100%}
.gauge {position:absolute;left:4.3%;top:73%;width:13%;aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(circle,#fafcfd 56%,transparent 57%),conic-gradient(#ba673b var(--amount,0%),#ccd5db 0);border:2px solid #384b44;box-shadow:2px 3px #384b4433;color:#31433c;font-size:1.7cqw}
.gauge strong {font-size:max(11px,1.6em);line-height:1.1}
/* 바깥 고리: 참을수록 차오르고, 다 차면 새어 나온다 */
.gauge::after {content:"";position:absolute;inset:-14%;border-radius:50%;background:conic-gradient(#d9482f var(--urge,0%),#d9482f22 0);mask:radial-gradient(closest-side,transparent 86%,#000 88%);-webkit-mask:radial-gradient(closest-side,transparent 86%,#000 88%)}
.dock {min-height:96px;margin-top:14px}
.dock:has(dialog[open]) footer {display:none}
dialog {position:static;margin:0;width:100%;padding:12px 20px;border:2px solid #253c3b;border-radius:11px;background:#fafcfd;color:#253c3b;text-align:center;box-shadow:0 4px #101f23}
/* 타이틀 메뉴: 무대 위에 덮인다. 난이도를 고르면 바로 시작한다 */
.menu {position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:2.4cqw;background:#192d35d9;text-align:center}
.menu[hidden] {display:none}
.menu > b {font-size:clamp(17px,4.2cqw,34px);letter-spacing:-.04em}
#levels {display:grid;grid-template-columns:1fr 1fr;gap:clamp(5px,1.4cqw,12px)}
.menu button {display:grid;gap:1px;touch-action:manipulation} .menu small {font-weight:600;font-size:clamp(10px,1.8cqw,14px);opacity:.8}
#levels button {min-width:clamp(140px,30cqw,250px);padding:clamp(4px,1.3cqw,12px) 10px}
#levels b {font-size:clamp(14px,2.7cqw,22px)}
#places,#extras {display:flex;gap:clamp(5px,1.2cqw,10px);justify-content:center}
#places button,#extras button {padding:clamp(3px,.9cqw,8px) clamp(8px,2cqw,18px);font-size:clamp(12px,2.1cqw,16px);background:#e3e9ec}
#places button[aria-pressed=true] {background:#ffca69}
/* 들킨 도감 */
.album {position:absolute;inset:0;overflow:auto;padding:3cqw;background:#192d35;text-align:center}
.album[hidden] {display:none}
.album b {font-size:clamp(15px,3cqw,24px)}
#albumList {list-style:none;margin:2cqw auto;padding:0;max-width:640px;display:grid;grid-template-columns:1fr 1fr;gap:.6cqw 3cqw;text-align:left;font-size:clamp(11px,2cqw,15px)}
#albumList .locked {opacity:.4}
#albumClose {padding:4px 18px}
#mute {padding:0 8px;background:none;color:inherit;border-color:#79908c;box-shadow:none;touch-action:manipulation}
#records {align-items:center;gap:4px;flex-wrap:wrap;display:flex;justify-content:space-between;margin:6px 2px;font-size:14px;color:#d4dfdb} #result {display:block}
dialog b {display:block;font-size:clamp(17px,3vw,25px)}
button {font:inherit;font-weight:800;border:2px solid #263b39;border-radius:9px;background:#ffca69;color:#233536;padding:8px 20px;cursor:pointer;box-shadow:0 3px #0e2428;touch-action:none;user-select:none;-webkit-user-select:none}
dialog button {margin:6px 4px 0} #menu,#share {background:#e3e9ec} button:active,button.pressed {transform:translateY(2px);box-shadow:none}
button:disabled {opacity:.5;cursor:default}
footer p {margin:0;font-weight:700} .help {color:#c7d2cb;font-size:14px;margin:8px 0}
@media (max-width:600px) {
  main {padding-inline:8px}
  .gauge span {display:none}
  footer {flex-direction:column;align-items:stretch;text-align:center}
  #push {padding:22px;font-size:20px}
}
</style>
<main>
<header><a href="../index.html">← 겨울 놀이터</a></header>
<h1>사람 몰래 똥싸기 <small>사물똥</small></h1>
<div id="records"><span id="levelName"></span><strong id="score">0점</strong><span id="best"></span><button id="mute" aria-label="소리 끄기"></button></div>
<div class="stage">
<canvas width="624" height="410" aria-label="위에서 본 화장실 세 칸, 세면대 세 대와 오른쪽 복도 입구"></canvas>
<div class="gauge"><strong>0%</strong><span>똥 게이지</span></div>
<nav class="menu" aria-label="게임 메뉴">
<div id="places" role="group" aria-label="장소"></div>
<div id="levels"></div>
<div id="extras"><button id="daily"></button><button id="endless"></button><button id="albumOpen"></button></div>
</nav>
<section class="album" hidden aria-label="들킨 도감"><b>들킨 도감</b><ul id="albumList"></ul><button id="albumClose">닫기</button></section>
</div>
<div class="dock">
<footer><p id="status" role="status">아무도 없는 회사 화장실</p><button id="push" disabled>꾹 힘주기</button></footer>
<dialog aria-labelledby="headline"><b id="headline"></b><span id="result"></span><button id="start">다시 시작</button><button id="menu">메뉴</button><button id="share">공유</button></dialog>
</div>
<p class="help">버튼이나 스페이스를 누르는 동안 힘줘요. 누가 걷거나, 손을 씻거나, 옆 칸에서 조용히 있으면 들켜요. 옆 칸이 “끙!” 할 때 같이 주면 둘이 1.5배, 셋이 2배! 너무 오래 참으면 빨간 고리가 차서 새어 나와요. 통화 중인 사람은 못 듣고, 핸드드라이어가 도는 동안은 아무도 못 들어요.</p>
</main>
<script type="module" src="src/main.js"></script>
</html>

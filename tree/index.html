<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1410">
  <title>트리 꾸미기</title>
  <link rel="icon" href="../tycoon/assets/web/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="view" aria-label="3D 크리스마스 트리"></canvas>

  <header>
    <a href="../">← 놀이터</a>
    <h1>트리 꾸미기</h1>
    <div>
      <button id="undo" title="되돌리기">↶</button>
      <button id="shot" title="사진 저장">📷</button>
      <button id="share" title="링크로 공유">🔗</button>
    </div>
  </header>

  <aside id="viewbar">
    <p>🎄 친구가 꾸민 트리예요. 돌려 보며 구경해 보세요</p>
    <div><button id="mine">나도 꾸미기</button><button id="adopt">이 트리 이어 꾸미기</button></div>
  </aside>

  <p id="loading">트리를 들여오는 중…</p>
  <p id="hint"></p>

  <footer>
    <nav id="tabs" role="tablist">
      <button data-tab="tree" class="on">🌲 나무</button>
      <button data-tab="orn">🔴 오너먼트</button>
      <button data-tab="lights">💡 전구</button>
      <button data-tab="garland">🎀 가랜드</button>
      <button data-tab="gift">🎁 선물·눈</button>
      <button data-tab="erase">🧽 지우개</button>
    </nav>
    <div id="panel"></div>
  </footer>

  <p id="toast" role="status" aria-live="polite"></p>
  <script type="module" src="src/main.js"></script>
</body>
</html>
